<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loadix</title>
    <style>
      /* Loadix design tokens, aligned with src/entrypoints/dashboard/app.css
         (macOS graphite neutrals + system blue; no invented palette).
         Light is the default; a stored dark dashboard theme flips to dark. */
      :root {
        color-scheme: light;
        --surface: #f5f5f7;
        --panel: #ffffff;
        --hover: #ececef;
        --line: #e3e3e6;
        --muted: #6e6e73;
        --ink: #1d1d1f;
        --primary: #007aff;
        --danger: #ff3b30;
        --success: #1f8a44;
        --primary-rgb: 0 122 255;
        --danger-rgb: 255 59 48;
        --success-rgb: 31 138 68;
        --font:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --surface: #1c1c1e;
        --panel: #2c2c2e;
        --hover: #3a3a3c;
        --line: #3a3a3c;
        --muted: #98989d;
        --ink: #f5f5f7;
        --primary: #0a84ff;
        --danger: #ff453a;
        --success: #30d158;
        --primary-rgb: 10 132 255;
        --danger-rgb: 255 69 58;
        --success-rgb: 48 209 88;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: var(--surface);
      }
      body {
        width: 284px;
        font-family: var(--font);
        font-size: 13px;
        letter-spacing: -0.011em;
        color: var(--ink);
        background: var(--surface);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        padding: 8px;
      }
      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid rgb(var(--primary-rgb) / 0.45);
        outline-offset: 1px;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }

      /* Hero --------------------------------------------------------------- */
      /* Primary but quiet: a faint blue tint + hairline accent, never a solid
         fill. The accent colour appears only as the icon and the border, so
         the row reads "important" without shouting. Same single-line anatomy
         as the other capture options. */
      .hero {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid rgb(var(--primary-rgb) / 0.3);
        background: rgb(var(--primary-rgb) / 0.08);
        color: var(--ink);
        text-align: left;
        transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
      }
      .hero:hover {
        background: rgb(var(--primary-rgb) / 0.13);
        border-color: rgb(var(--primary-rgb) / 0.5);
      }
      .hero:active {
        transform: translateY(0.5px);
      }
      .hero b {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #heroDesc {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .hero svg {
        color: var(--primary);
      }

      /* Secondary modes ---------------------------------------------------- */
      /* A flat segmented row instead of a disclosure: every variant is one
         click away (no expand step). Hierarchy comes from the hero's tint;
         these stay as quiet ghost buttons with a hairline outline. */
      .modes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 6px;
      }
      .seg {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 2px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        transition: border-color 100ms ease, color 100ms ease, background 100ms ease, transform 80ms ease;
      }
      .seg:hover {
        border-color: rgb(var(--primary-rgb) / 0.5);
        color: var(--primary);
        background: rgb(var(--primary-rgb) / 0.05);
      }
      .seg:active {
        transform: translateY(0.5px);
      }
      .seg svg {
        color: var(--muted);
        transition: color 100ms ease;
      }
      .seg:hover svg {
        color: var(--primary);
      }

      /* Status -------------------------------------------------------------- */
      .status {
        display: none;
        align-items: center;
        gap: 7px;
        margin: 4px 2px 0;
        padding: 6px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--ink);
      }
      .status.busy {
        display: flex;
        color: var(--primary);
        border-color: rgb(var(--primary-rgb) / 0.35);
      }
      .status.done {
        display: flex;
        color: var(--success);
        border-color: rgb(var(--success-rgb) / 0.35);
      }
      .status.error {
        display: flex;
        color: var(--danger);
        border-color: rgb(var(--danger-rgb) / 0.4);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .spin {
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Footer --------------------------------------------------------------- */
      .foot {
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px solid var(--line);
      }
      .dash {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        border-radius: 6px;
        text-align: left;
        transition: background 100ms ease;
      }
      .dash:hover {
        background: var(--hover);
      }
      .dash svg:first-child {
        color: var(--muted);
      }
      .dash b {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
      }
      .dash .arrow {
        color: var(--muted);
        opacity: 0;
        transform: translateX(-2px);
        transition: opacity 100ms ease, transform 100ms ease;
      }
      .dash:hover .arrow {
        opacity: 1;
        transform: translateX(0);
      }
    </style>
  </head>
  <body>
    <button class="hero" id="heroRegion" data-mode="selection">
      <span id="heroIcon"></span>
      <b id="heroTitle"></b>
      <span id="heroDesc"></span>
    </button>

    <div class="modes">
      <button class="seg" data-mode="fullpage" id="modeFull">
        <span data-icon="fullpage"></span>
        <b id="optFull"></b>
      </button>
      <button class="seg" data-mode="visible" id="modeVisible">
        <span data-icon="visible"></span>
        <b id="optVisible"></b>
      </button>
      <button class="seg" data-mode="element" id="modeElement">
        <span data-icon="element"></span>
        <b id="optElement"></b>
      </button>
    </div>

    <div class="status" id="status" role="status">
      <span id="statusIcon"></span>
      <span id="statusText"></span>
    </div>

    <div class="foot">
      <button class="dash" id="openDash">
        <span data-icon="dash"></span>
        <b id="dashLabel"></b>
        <span data-icon="arrow"></span>
      </button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
