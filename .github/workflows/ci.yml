name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes any still-running pipeline: quick
# follow-up commits cancel the previous run instead of stacking several full
# npm-ci + build pipelines (each run reinstalls the tree three times).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Cold installs are slow and npm prints nothing until the end, so the
        # step can look hung. Fail loudly past 15 min; audits off to cut the
        # extra registry chatter that stalls installs.
        timeout-minutes: 15
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Zip extension
        run: npm run zip

      - name: Prepare artifact
        run: mkdir -p dist && cp .output/*.zip dist/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loadix-extension
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Cold installs are slow and npm prints nothing until the end, so the
        # step can look hung. Fail loudly past 15 min; audits off to cut the
        # extra registry chatter that stalls installs.
        timeout-minutes: 15
        run: npm ci --no-audit --no-fund

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: Loadix-extension
          path: dist

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
