name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Zip extension
        run: npm run zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadforge-extension
          path: .output/*.zip
          if-no-files-found: error
