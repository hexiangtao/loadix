<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Loadix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0066D6"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS / macOS app icon shape) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle highlight -->
  <rect x="0" y="0" width="1024" height="512" rx="224" ry="224" fill="#FFFFFF" opacity="0.06"/>

  <!-- "L" mark: thick stem + base, drawn with rounded rects -->
  <g fill="#FFFFFF">
    <rect x="270" y="200" width="120" height="500" rx="60" ry="60"/>
    <rect x="270" y="640" width="420" height="120" rx="60" ry="60"/>
  </g>

  <!-- Load curve: rising throughput line with a peak + dip + rise -->
  <g fill="none" stroke="url(#chart)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="305,820 410,760 500,700 580,640 660,580 760,500 870,420"/>
  </g>

  <!-- Endpoint dot -->
  <circle cx="870" cy="420" r="46" fill="#FFFFFF"/>
  <circle cx="870" cy="420" r="22" fill="#0A84FF"/>
</svg>
